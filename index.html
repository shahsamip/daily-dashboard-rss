<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            transition: background 0.3s, color 0.3s;
        }
        body.dark { background: #000; color: #fff; }
        body.light { background: #fff; color: #000; }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .theme-toggle:hover { opacity: 1; }
        .dark .theme-toggle { border-color: #fff; color: #fff; }
        .light .theme-toggle { border-color: #000; color: #000; }

        .time { font-size: 8rem; font-weight: 200; margin-bottom: 0.5rem; }
        .date { font-size: 1.5rem; opacity: 0.6; margin-bottom: 3rem; }

        .year-progress { width: 100%; max-width: 600px; margin-bottom: 3rem; }
        .progress-label { display: flex; justify-content: space-between; opacity: 0.5; margin-bottom: 0.5rem; }
        .progress-bar-container { width: 100%; height: 4px; border-radius: 2px; overflow: hidden; }
        .dark .progress-bar-container { background: rgba(255, 255, 255, 0.1); }
        .light .progress-bar-container { background: rgba(0, 0, 0, 0.1); }
        .progress-bar-fill { height: 100%; transition: width 0.3s ease; }
        .dark .progress-bar-fill { background: #fff; }
        .light .progress-bar-fill { background: #000; }

        .weather { display: flex; align-items: center; gap: 2rem; margin-bottom: 3rem; }
        .temp { font-size: 4rem; font-weight: 300; }
        .condition { opacity: 0.8; margin-bottom: 0.3rem; }
        .location { opacity: 0.5; }

        /* News Section */
        .news-section { width: 100%; max-width: 600px; margin-top: 2rem; }
        .news-title { font-size: 1.5rem; margin-bottom: 1rem; opacity: 0.8; }
        .news-list { list-style: none; }
        .news-item { margin-bottom: 0.8rem; line-height: 1.4; }
        .news-item a { text-decoration: none; }
        .dark .news-item a { color: #9cd2ff; }
        .light .news-item a { color: #0055aa; }
    
        /* Layout container for clean aesthetic */
        .container {
            max-width: 720px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            padding-bottom: 4rem;
        }

        /* Improve spacing + alignment */
        .section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1rem;
        }

        /* Cleaner news list */
        .news-list { padding-left: 1rem; }
        .news-item { opacity: 0.85; }

        /* Subtle hover */
        .news-item a:hover { opacity: 0.6; }

        /* Smooth fade animations */
        .fade-in {
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .time { font-size: 5rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body class="dark">
    <div class="container fade-in">
    <button class="theme-toggle" id="themeToggle">◐</button>

    <div class="time" id="time">00:00</div>
    <div class="date" id="date">Loading...</div>

    <div class="year-progress">
        <div class="progress-label">
            <span>Year Progress</span>
            <span id="daysLeft"></span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="section weather">
        <div class="temp" id="temp">--°</div>
        <div>
            <div class="condition" id="condition">Loading weather...</div>
            <div class="location" id="location"></div>
        </div>
    </div>

    <!-- News Section -->
    <div class="section news-section fade-in">
        <div class="news-title">Latest Headlines</div>
        <ul class="news-list" id="newsList">
            <li class="news-item">Loading news...</li>
        </ul>
    </div>

<script>
// Theme toggle
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    document.body.classList.toggle('light');
});

// Time + Year Progress
function updateTime() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}`;

    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);

    const start = new Date(now.getFullYear(), 0, 1);
    const end = new Date(now.getFullYear() + 1, 0, 1);
    const progress = ((now - start) / (end - start)) * 100;

    const daysLeft = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
    document.getElementById('daysLeft').textContent = `${daysLeft} days left`;
    document.getElementById('progressBar').style.width = progress + '%';
}
setInterval(updateTime, 1000);
updateTime();

// Weather API
async function getWeather() {
    try {
        const pos = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject));
        const { latitude, longitude } = pos.coords;

        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto`);
        const wData = await weatherRes.json();

        const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
        const gData = await geoRes.json();

        const codes = { 0: 'Clear', 1: 'Mostly Clear', 2: 'Partly Cloudy', 3: 'Cloudy', 45:'Foggy',48:'Foggy',51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',61:'Light Rain',63:'Rain',65:'Heavy Rain',71:'Light Snow',73:'Snow',75:'Heavy Snow',95:'Thunderstorm' };

        document.getElementById('temp').textContent = Math.round(wData.current.temperature_2m) + '°';
        document.getElementById('condition').textContent = codes[wData.current.weather_code] || 'Unknown';
        document.getElementById('location').textContent = gData.city || gData.locality || 'Unknown';
    } catch {
        document.getElementById('condition').textContent = 'Weather unavailable';
    }
}
getWeather();
setInterval(getWeather, 600000);

// Minimal News API (Top 5 Headlines)
async function loadNews() {
    const list = document.getElementById('newsList');
    list.innerHTML = '<li class="news-item">Loading...</li>';

    try {
        const res = await fetch("https://gnews.io/api/v4/top-headlines?lang=en&country=us&max=5&apikey=demo");
        const data = await res.json();

        list.innerHTML = '';
        data.articles.slice(0, 5).forEach(a => {
            const li = document.createElement('li');
            li.className = 'news-item';
            li.innerHTML = `<a href='${a.url}' target='_blank'>• ${a.title}</a>`;
            list.appendChild(li);
        });
    } catch (e) {
        list.innerHTML = '<li class="news-item">Unable to load news</li>';
    }
}
loadNews();
setInterval(loadNews, 300000);
</script>
    </div>
</body>
</html>
